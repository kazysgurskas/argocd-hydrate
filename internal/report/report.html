<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} - manifest diff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --ground: #f2f3f5; --surface: #ffffff; --surface-2: #e9ebee; --hair: #cfd4db; --hair-soft: #e3e6ea;
  --ink: #111827; --ink-2: #4b5563; --ink-3: #8b94a3;
  --accent: #b45309; --accent-ink: #92400e; --accent-tint: #fdf0e1; --ring: rgba(180,83,9,.35);
  --add: #15803d; --add-tint: #e9f7ee; --add-strong: #b6e7c6;
  --del: #b91c1c; --del-tint: #fdeded; --del-strong: #f4c3c3;
  --mod: #a16207; --mod-tint: #fdf5e0;
  --hunk: #eceff3; --hunk-ink: #6b7280;
  --key: #1d4ed8; --str: #334e68; --num: #7e22ce; --cmt: #8b94a3;
  --h-app: #3730a3; --h-app-bg: #e6e5ff; --h-project: #9a3412; --h-project-bg: #ffe9dd; --h-cluster: #6d28d9; --h-cluster-bg: #efe6ff; --h-api: #4b5563; --h-api-bg: #e9ebee;
  --k-workload: #1d4ed8; --k-workload-bg: #e3ebff; --k-network: #6d28d9; --k-network-bg: #efe6ff; --k-config: #9a3412; --k-config-bg: #ffe9dd; --k-policy: #0f766e; --k-policy-bg: #d9f3ef; --k-security: #9d174d; --k-security-bg: #fde4ee; --k-other: #4b5563; --k-other-bg: #e9ebee;
  --sans: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
[data-theme="dark"] {
  --ground: #0f1216; --surface: #161a20; --surface-2: #1e242c; --hair: #2c343f; --hair-soft: #232a33;
  --ink: #e7eaee; --ink-2: #a3acb8; --ink-3: #6b7482;
  --accent: #f59e0b; --accent-ink: #fbbf24; --accent-tint: #2e2008; --ring: rgba(245,158,11,.4);
  --add: #4ade80; --add-tint: #10261a; --add-strong: #1f5a35; --del: #f87171; --del-tint: #2d1516; --del-strong: #6a2425; --mod: #fbbf24; --mod-tint: #2a2111;
  --hunk: #151a21; --hunk-ink: #7f8a99; --key: #93c5fd; --str: #a5c8ff; --num: #d8b4fe; --cmt: #6b7482;
  --h-app: #a5b4fc; --h-app-bg: #1e1f4a; --h-project: #fdba74; --h-project-bg: #3a1f10; --h-cluster: #c4b5fd; --h-cluster-bg: #2a1d4d; --h-api: #a3acb8; --h-api-bg: #1e242c;
  --k-workload: #93c5fd; --k-workload-bg: #172548; --k-network: #c4b5fd; --k-network-bg: #2a1d47; --k-config: #fdba74; --k-config-bg: #3a2810; --k-policy: #5eead4; --k-policy-bg: #0f2f2b; --k-security: #f9a8d4; --k-security-bg: #3d1527; --k-other: #a3acb8; --k-other-bg: #1e242c;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #0f1216; --surface: #161a20; --surface-2: #1e242c; --hair: #2c343f; --hair-soft: #232a33;
  --ink: #e7eaee; --ink-2: #a3acb8; --ink-3: #6b7482;
  --accent: #f59e0b; --accent-ink: #fbbf24; --accent-tint: #2e2008; --ring: rgba(245,158,11,.4);
  --add: #4ade80; --add-tint: #10261a; --add-strong: #1f5a35; --del: #f87171; --del-tint: #2d1516; --del-strong: #6a2425; --mod: #fbbf24; --mod-tint: #2a2111;
  --hunk: #151a21; --hunk-ink: #7f8a99; --key: #93c5fd; --str: #a5c8ff; --num: #d8b4fe; --cmt: #6b7482;
  --h-app: #a5b4fc; --h-app-bg: #1e1f4a; --h-project: #fdba74; --h-project-bg: #3a1f10; --h-cluster: #c4b5fd; --h-cluster-bg: #2a1d4d; --h-api: #a3acb8; --h-api-bg: #1e242c;
  --k-workload: #93c5fd; --k-workload-bg: #172548; --k-network: #c4b5fd; --k-network-bg: #2a1d47; --k-config: #fdba74; --k-config-bg: #3a2810; --k-policy: #5eead4; --k-policy-bg: #0f2f2b; --k-security: #f9a8d4; --k-security-bg: #3d1527; --k-other: #a3acb8; --k-other-bg: #1e242c;
}}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--hair); }
a:hover { border-bottom-color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 4px; border: 1px solid var(--hair); background: var(--surface); color: var(--ink-2); font-size: 13px; font-weight: 600; letter-spacing: .01em; }
.pill:hover { border-color: var(--ink-3); color: var(--ink); }
.pill.on { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-ink); }
.pill:disabled { opacity: .45; cursor: default; }
.pill.sm { height: 22px; padding: 0 7px; font-size: 12px; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; }
.tabs { display: inline-flex; border-bottom: 1px solid var(--hair); }
.tabs button { height: 28px; padding: 0 10px; border: 0; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.field { display: inline-flex; align-items: center; height: 28px; border: 1px solid var(--hair); background: var(--surface); padding: 0 10px; border-radius: 4px; font-size: 13px; position: relative; }
.field select { border: 0; background: transparent; padding: 0 14px 0 0; height: 100%; color: var(--ink); appearance: none; -webkit-appearance: none; font-weight: 600; }
.field.sel::after { content: ""; position: absolute; right: 9px; top: 10px; width: 6px; height: 6px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: rotate(45deg); pointer-events: none; }
.search input { width: 320px; height: 28px; border: 1px solid var(--hair); border-radius: 4px; background: var(--surface); padding: 0 10px; color: var(--ink); font-family: var(--mono); font-size: 12.5px; }
.search input::placeholder { color: var(--ink-3); font-family: var(--sans); }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--hair); border-radius: 3px; padding: 0 4px; margin: 0 2px; color: var(--ink-2); background: var(--surface); }

.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 2px solid var(--ink); }
[data-theme="dark"] .top { border-bottom-color: var(--hair); }
.top-inner { max-width: 1880px; margin: 0 auto; padding: 10px 20px 0; display: grid; gap: 8px; }
.titlebar { display: flex; align-items: center; gap: 14px; }
.tl { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); }
.titlebar h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.titlebar .pr-title { color: var(--ink-2); font-size: 15px; }
.titlebar .right { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 12.5px; }
.refs { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); font-size: 13px; }
.refs code { font-family: var(--mono); font-size: 12px; color: var(--ink); }
.metrics { display: flex; flex-wrap: wrap; border: 1px solid var(--hair); border-radius: 4px; overflow: hidden; }
.metric { display: grid; padding: 6px 14px; min-width: 96px; border-right: 1px solid var(--hair-soft); line-height: 1.15; }
.metric:last-child { border-right: 0; }
.metric .v { font-family: var(--mono); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.metric .l { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-top: 2px; }
.metric.add .v { color: var(--add); } .metric.del .v { color: var(--del); } .metric.mod .v { color: var(--mod); }
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.strip-l { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px; }
.app-chip { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px 0 10px; border: 1px solid var(--hair); border-radius: 4px; background: var(--surface); font-size: 12.5px; }
.app-chip:hover { border-color: var(--ink-3); }
.app-chip.on { border-color: var(--accent); background: var(--accent-tint); }
.app-chip .an { font-family: var(--mono); font-weight: 600; }
.app-chip .ac { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 0 10px; border-top: 1px solid var(--hair-soft); }
.toolbar .end { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.tag { display: inline-flex; align-items: baseline; gap: 4px; font-size: 11px; line-height: 16px; border-radius: 3px; padding: 0 6px; color: var(--ink-2); background: var(--surface-2); font-family: var(--mono); }
.tag .key { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; font-family: var(--sans); font-weight: 700; }
.tag.app { color: var(--h-app); background: var(--h-app-bg); } .tag.project { color: var(--h-project); background: var(--h-project-bg); } .tag.cluster { color: var(--h-cluster); background: var(--h-cluster-bg); } .tag.api { color: var(--h-api); background: var(--h-api-bg); }
.add { color: var(--add); } .del { color: var(--del); } .mod { color: var(--mod); }
.stat { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }

.layout { max-width: 1880px; margin: 0 auto; padding: 14px 20px 40px; display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0,1fr); } .sidebar { position: static; max-height: none; } }
.sidebar { position: sticky; top: calc(var(--top-h, 200px) + 14px); max-height: calc(100vh - var(--top-h, 200px) - 28px); overflow: auto; border: 1px solid var(--hair); border-radius: 4px; background: var(--surface); font-size: 13px; }
.sidebar .count { position: sticky; top: 0; background: var(--surface); padding: 8px 12px; color: var(--ink-3); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid var(--hair); font-weight: 700; }
.group + .group { border-top: 1px solid var(--hair-soft); }
.group-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; user-select: none; }
.group-h:hover { background: var(--surface-2); }
.chev { display: inline-block; width: 7px; height: 7px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: rotate(45deg); transition: transform .12s; margin: 0 4px 2px 2px; flex: none; }
.group.closed .chev, .file.collapsed .file-h .chev { transform: rotate(-45deg); }
.group-h .gname { font-family: var(--mono); font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group-h .gsub { display: inline-flex; gap: 4px; }
.gsub .tag { font-size: 10px; line-height: 15px; }
.group.closed .items { display: none; }
.items { position: relative; margin-left: 17px; border-left: 1px solid var(--hair); }
.item { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 14px; cursor: pointer; position: relative; }
.item::before { content: ""; position: absolute; left: 0; top: 50%; width: 9px; height: 1px; background: var(--hair); }
.item:hover { background: var(--surface-2); }
.item.active { background: var(--accent-tint); box-shadow: inset 2px 0 0 var(--accent); }
.item.hide, .group.hide, .file.hide { display: none; }
.dot { width: 7px; height: 7px; border-radius: 1px; flex: none; }
.dot.added { background: var(--add); } .dot.deleted { background: var(--del); } .dot.modified { background: var(--mod); }
.item .kind { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; flex: none; border-radius: 3px; padding: 0 4px; color: var(--k-other); background: var(--k-other-bg); }
.item .kind.workload { color: var(--k-workload); background: var(--k-workload-bg); } .item .kind.network { color: var(--k-network); background: var(--k-network-bg); } .item .kind.config { color: var(--k-config); background: var(--k-config-bg); } .item .kind.policy { color: var(--k-policy); background: var(--k-policy-bg); } .item .kind.security { color: var(--k-security); background: var(--k-security-bg); }
.item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; }

.file { background: var(--surface); border: 1px solid var(--hair); border-radius: 4px; margin-bottom: 12px; scroll-margin-top: calc(var(--top-h, 200px) + 12px); overflow: clip; }
.file-h { display: flex; align-items: center; gap: 14px; padding: 8px 12px; position: sticky; top: var(--top-h, 200px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--hair-soft); cursor: pointer; }
.file.collapsed .file-h { border-bottom: 0; }
.file.collapsed .file-b { display: none; }
.status { flex: none; align-self: flex-start; margin-top: 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #fff; border-radius: 3px; padding: 2px 8px; }
.status.added { background: var(--add); } .status.deleted { background: var(--del); } .status.modified { background: var(--mod); }
.file-h .title { flex: 1; min-width: 0; display: grid; gap: 3px; }
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 0; font-family: var(--mono); font-size: 13px; }
.crumb .cr { color: var(--ink-2); font-style: normal; }
.crumb .cr + .cr::before { content: "/"; color: var(--ink-3); margin: 0 7px; }
.crumb .cr.app { color: var(--h-app); } .crumb .cr.project { color: var(--h-project); } .crumb .cr.cluster { color: var(--h-cluster); }
.crumb .leaf { display: inline-flex; align-items: center; gap: 7px; }
.rkind { font-family: var(--sans); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-radius: 3px; padding: 1px 6px; color: var(--k-other); background: var(--k-other-bg); }
.rkind.workload { color: var(--k-workload); background: var(--k-workload-bg); } .rkind.network { color: var(--k-network); background: var(--k-network-bg); } .rkind.config { color: var(--k-config); background: var(--k-config-bg); } .rkind.policy { color: var(--k-policy); background: var(--k-policy-bg); } .rkind.security { color: var(--k-security); background: var(--k-security-bg); }
.rname { font-weight: 700; color: var(--ink); }
.meta-line { display: flex; gap: 12px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow: hidden; }
.meta-line .api { color: var(--h-api); }
.meta-line .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-h .actions { display: flex; gap: 12px; align-items: center; flex: none; }
.fbar { display: flex; gap: 2px; }
.fbar i { width: 8px; height: 10px; border-radius: 1px; background: var(--surface-2); }
.fbar i.a { background: var(--add); } .fbar i.d { background: var(--del); }
.file-b { font-family: var(--mono); font-size: 12.5px; line-height: 20px; overflow-x: auto; }
.file-b.wrap .txt { white-space: pre-wrap; word-break: break-all; }
.placeholder { padding: 24px; color: var(--ink-3); text-align: center; font-family: var(--sans); }
.row { display: grid; grid-template-columns: 48px 48px 22px minmax(0,1fr); }
.row.add { background: var(--add-tint); } .row.del { background: var(--del-tint); }
.ln { text-align: right; padding-right: 8px; color: var(--ink-3); user-select: none; font-size: 11px; font-variant-numeric: tabular-nums; }
.row.add .ln, .row.del .ln, .side.add .ln, .side.del .ln { color: var(--ink-2); }
.sign { text-align: center; user-select: none; color: var(--ink-3); font-weight: 700; }
.row.add .sign { color: var(--add); } .row.del .sign { color: var(--del); }
.txt { white-space: pre; padding: 0 14px 0 4px; tab-size: 2; }
mark { background: var(--del-strong); color: inherit; border-radius: 2px; }
.row.add mark, .side.add mark { background: var(--add-strong); }
.hunk { background: var(--hunk); color: var(--hunk-ink); padding: 2px 12px; font-size: 11px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--hair-soft); border-bottom: 1px solid var(--hair-soft); font-family: var(--sans); }
.hunk .x { flex: 1; font-family: var(--mono); }
.hunk button { height: 18px; padding: 0 7px; border-radius: 3px; border: 1px solid var(--hair); background: var(--surface); color: var(--accent-ink); font-size: 11px; font-weight: 600; }
.k { color: var(--key); } .s { color: var(--str); } .n { color: var(--num); } .c { color: var(--cmt); font-style: italic; }
.srow { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
.side { display: grid; grid-template-columns: 48px minmax(0,1fr); min-width: 0; }
.side + .side { border-left: 1px solid var(--hair); }
.side.add { background: var(--add-tint); } .side.del { background: var(--del-tint); }
.side.blank { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--hair-soft) 6px 7px); }
.more { font-family: var(--sans); padding: 8px 12px; border-top: 1px solid var(--hair-soft); }
.empty { grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--hair); border-radius: 4px; padding: 56px 24px; text-align: center; color: var(--ink-2); }
.empty h2 { margin: 0 0 6px; color: var(--ink); }
.footer { max-width: 1880px; margin: 0 auto; padding: 0 20px 28px; color: var(--ink-3); font-size: 12px; }
@media print { .top { position: static; } .sidebar, .toolbar, .strip { display: none; } .layout { display: block; } .file-h { position: static; } }
</style>

<body>
<script type="application/json" id="diff-data">{{.Data}}</script>
<noscript><p style="padding:20px">This report needs JavaScript to render.</p></noscript>
<header class="top"><div class="top-inner" id="top"></div></header>
<div class="layout" id="layout"></div>
<div class="footer" id="footer"></div>
<script>
(function () {
'use strict';
var DATA = JSON.parse(document.getElementById('diff-data').textContent);
var meta = DATA.meta, R = DATA.result, files = R.files || [];
var state = { view: 'unified', context: 'compact', wrap: false, q: '', status: new Set(), app: '', project: '', cluster: '', kind: '', active: -1 };
var LIMIT = 300;

function esc(s) { return s.replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function h(tag, attrs) {
  var el = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v === null || v === undefined) return;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
    else if (k === 'disabled') el.disabled = !!v;
    else el.setAttribute(k, v);
  });
  for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}
function append(el, kid) {
  if (kid === null || kid === undefined || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(function (k) { append(el, k); }); return; }
  el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
}
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
function statText(add, del) {
  return h('span', {class: 'stat'}, add ? h('span', {class: 'add'}, '+' + add) : null, add && del ? ' ' : null, del ? h('span', {class: 'del'}, '-' + del) : null);
}
function res(f) { return f.resource || {}; }
function appLabel(f) { return res(f).app || f.path.split('/')[0]; }
function groupKey(f) { var r = res(f); return [appLabel(f), r.project || '', r.cluster || ''].join('|'); }
function displayName(f) { return res(f).name || f.path.split('/').pop().replace(/\.ya?ml$/, ''); }
/* Kind family, for the tint on kind labels. */
function kindFamily(r) {
  var k = r.kind || '', g = (r.apiVersion || '').split('/')[0];
