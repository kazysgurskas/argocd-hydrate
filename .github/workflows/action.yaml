name: action

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release to install
        required: true

jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          version: ${{ inputs.version || github.event.release.tag_name }}
      - run: argocd-diff --version
        shell: bash
