name: argocd-diff
description: Install argocd-diff, which renders ArgoCD Applications and diffs the rendered manifests
author: Kazys Gurskas
branding:
  icon: git-pull-request
  color: blue

inputs:
  version:
    description: >-
      Release to install, such as v1.0.0. Defaults to the ref this action is
      used at, so `uses: kazysgurskas/argocd-diff@v1.0.0` installs v1.0.0.
      Pinning the action by commit SHA requires this input.
    required: false
    default: ''

outputs:
  version:
    description: The release that was installed
    value: ${{ steps.install.outputs.version }}
  path:
    description: Directory the binary was installed to
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        version=${VERSION:-$ACTION_REF}
        case "$version" in
          v[0-9]*) ;;
          *) echo "::error::argocd-diff: set 'version: vX.Y.Z'; the action is used at '$version', which is not a release tag"; exit 1 ;;
        esac
        case "$RUNNER_OS" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          Windows) os=windows ;;
          *) echo "::error::argocd-diff: no release for runner OS $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::argocd-diff: no release for runner architecture $RUNNER_ARCH"; exit 1 ;;
        esac
        archive="argocd-diff-$version-$os-$arch.tar.gz"
        release="https://github.com/kazysgurskas/argocd-diff/releases/download/$version"
        dir="$RUNNER_TEMP/argocd-diff"
        mkdir -p "$dir"
        cd "$dir"
        curl -fsSL --retry 3 -o "$archive" "$release/$archive"
        curl -fsSL --retry 3 -o checksums.txt "$release/checksums.txt"
        grep " $archive\$" checksums.txt | sha256sum -c -
        tar -xzf "$archive"
        rm -f "$archive" checksums.txt
        echo "$dir" >> "$GITHUB_PATH"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "path=$dir" >> "$GITHUB_OUTPUT"
        exe=""
        [ "$os" = windows ] && exe=".exe"
        "./argocd-diff$exe" --version
