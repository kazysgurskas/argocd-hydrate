# Two ArgoCD Applications with directory sources, as the root chart of a
# GitOps repo would render them. Paths are relative to this directory, the
# checkout.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp.stage.cluster-1
spec:
  project: stage
  destination:
    name: cluster-1
    namespace: myapp
  source:
    repoURL: https://github.com/example/gitops
    targetRevision: HEAD
    path: myapp
    directory:
      recurse: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otherapp.stage.cluster-1
spec:
  project: stage
  destination:
    name: cluster-1
    namespace: otherapp
  source:
    repoURL: https://github.com/example/gitops
    targetRevision: HEAD
    path: otherapp
    directory:
      recurse: true
