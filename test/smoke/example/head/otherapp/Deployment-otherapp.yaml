apiVersion: apps/v1
kind: Deployment
metadata:
  name: otherapp
  namespace: otherapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: otherapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otherapp
    spec:
      containers:
        - name: otherapp
          image: ghcr.io/example/otherapp:v1.3.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
